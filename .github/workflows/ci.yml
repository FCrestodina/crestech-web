# CI mínimo: typecheck + lint + build en cada push a develop/main y en cada PR (develop sumado el
# 2026-09-16, acción 8 de la optimización del sistema: antes solo corría en main).
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npx eslint .

      - name: Build
        run: npx next build
